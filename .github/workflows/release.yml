name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify-version:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches Info.plist and CHANGELOG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          plist=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" resources/Info.plist)
          if [ "$version" != "$plist" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match CFBundleShortVersionString ${plist}"
            exit 1
          fi
          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [${version}] section"
            exit 1
          fi

  release:
    needs: [ci, verify-version]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build universal zip
        run: make release-zip

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            build/OllamaBar.app.zip build/OllamaBar.app.zip.sha256 --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$assets"
          echo "$assets" | grep -qx "OllamaBar.app.zip"
          echo "$assets" | grep -qx "OllamaBar.app.zip.sha256"
